<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Blog Admin | Acctentity Consultancy</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
[hidden]{display:none!important}main{max-width:760px;margin:0 auto;padding:30px 18px 90px}
form{max-width:none}fieldset{border:1px solid var(--ln);border-radius:10px;padding:18px;display:grid;gap:14px;min-width:0}legend{font-weight:700;padding:0 8px}
input,select,textarea{width:100%;min-width:0}textarea#body{min-height:380px}small{font-weight:400;color:var(--mu)}
.bar{display:flex;gap:6px;flex-wrap:wrap}button.small{font:inherit;font-size:.9rem;cursor:pointer;padding:6px 12px}
.item{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--ln)}.item b{flex:1 1 220px}
#msg{position:sticky;top:0;background:var(--bg);font-weight:700;min-height:1.6em;z-index:2;max-width:none}
#preview{border:1px dashed var(--ln);border-radius:8px;padding:16px;overflow-x:auto}#preview img{max-width:100%}#preview.phone{max-width:375px}
td,th{border:1px solid var(--ln);padding:6px 10px}table{border-collapse:collapse}
.google{font-family:Arial,sans-serif;border:1px solid var(--ln);border-radius:8px;padding:14px;background:#fff;color:#4d5156;font-size:14px;overflow-wrap:anywhere}.google .t{color:#1a0dab;font-size:19px}
.ok{color:#18803a}.warn{color:#c0392b}#checks,#links{margin:0;padding-left:1.2em;font-size:.93rem}
</style>
</head>
<body>
<main>
<h2>Blog admin</h2>
<p id="msg" role="status"></p>
<form id="login">
  <label>Admin password<input type="password" id="pw" required autocomplete="current-password"></label>
  <button class="btn">Log in</button>
</form>
<div id="panel" hidden>
<form id="editor" novalidate>
  <h3 id="mode">New article</h3>
  <fieldset><legend>1. Content</legend>
    <label>Title<input id="title" maxlength="150"></label>
    <label>URL (slug) <small id="url"></small><input id="slug" maxlength="80"></label>
    <label>Category<select id="category"><option value="">Choose...</option><option>Business Registration</option><option>KRA Tax</option><option>Accounting</option><option>Payroll</option><option>Advisory</option></select></label>
    <label>Tags <small>separate with commas</small><input id="tags" placeholder="eCitizen, KRA PIN, LTD"></label>
    <label>Excerpt <small>1-2 sentences</small><input id="summary" maxlength="300"></label>
    <div class="bar" id="tools">
      <button type="button" class="small" data-line="## ">H2</button><button type="button" class="small" data-line="### ">H3</button>
      <button type="button" class="small" data-wrap="bold"><b>Bold</b></button><button type="button" class="small" data-line="- ">Bullet list</button>
      <button type="button" class="small" data-wrap="link">Link</button><button type="button" class="small" data-wrap="table">Table</button>
      <button type="button" class="small" data-wrap="image">Photo in text</button><input type="file" id="inline" accept="image/*" hidden>
    </div>
    <label>Article<textarea id="body"></textarea></label>
    <div><div class="bar"><b style="flex:1">Preview</b><button type="button" class="small" id="phone">Phone / full width</button></div><div id="preview"></div></div>
    <label>Featured photo <small id="hasImage"></small><input type="file" id="photo" accept="image/*"></label>
    <label>Alt text <small>describe the photo; required if there is one</small><input id="imageAlt" maxlength="200"></label>
    <label>Author name<input id="author" maxlength="80"></label>
    <label>Author photo <small>optional</small><input type="file" id="authorPhoto" accept="image/*"></label>
    <b>FAQ <small>optional, 3-5 questions readers really ask</small></b>
    <div id="faqs" style="display:grid;gap:10px"></div>
    <button type="button" class="small" id="addFaq">+ Add question</button>
  </fieldset>
  <fieldset><legend>2. SEO</legend>
    <label>SEO title <small id="seoCount"></small><input id="seoTitle" maxlength="120"></label>
    <label>Meta description <small id="metaCount"></small><textarea id="metaDescription" rows="3" maxlength="300"></textarea></label>
    <label>Focus keyword<input id="keyword" placeholder="register business Kenya"></label>
    <label>Canonical URL <small>leave empty unless this was first published elsewhere</small><input id="canonical" type="url" placeholder="https://"></label>
    <div><b>Google preview</b> <small>(approximate; Google may rewrite it)</small><div class="google"><div id="gUrl"></div><div class="t" id="gTitle"></div><div id="gDesc"></div></div></div>
    <div><b>Checks</b><ul id="checks"></ul></div>
    <div><b>Suggested internal links</b> <small>tap to insert</small><div class="bar" id="links"></div></div>
  </fieldset>
  <fieldset><legend>3. Publishing</legend>
    <label>Status<select id="status"><option value="draft">Draft (hidden)</option><option value="published">Published</option><option value="scheduled">Scheduled</option></select></label>
    <label>Publish date and time <small>needed for Scheduled</small><input type="datetime-local" id="publishAt"></label>
    <div class="bar"><button class="btn" id="save">Save</button><button type="button" class="small" id="cancel">New / clear form</button></div>
  </fieldset>
</form>
<h3 style="margin-top:40px">Your articles</h3>
<div id="list"></div>
</div>
</main>
<script type="module">
import { render, slugify, esc } from '/assets/js/render.js';
const $ = (id) => document.getElementById(id);
const fields = ['title','slug','category','tags','summary','body','imageAlt','author','seoTitle','metaDescription','keyword','canonical','status'];
const pages = [
  ['Company Registration', '/company-registration', 'register registration company ltd ecitizen business name'],
  ['Tax & Compliance', '/tax', 'tax vat kra pin returns etims compliance'],
  ['Accounting & Bookkeeping', '/accounting', 'accounting bookkeeping records payroll invoice'],
  ['Financial Advisory', '/advisory', 'advisory finance cash flow budget growth'],
  ['Audit & Assurance', '/audit', 'audit assurance review'],
  ['ERP Solutions', '/erp-solutions', 'erp system software'],
  ['Contact us', '/contact', 'consultation contact']
];
let password = '', editing = '', posts = [], slugTouched = false, dirty = false;

async function api(url, options = {}) {
  const r = await fetch(url, { ...options, headers: { 'x-admin-password': encodeURIComponent(password), 'Content-Type': 'application/json' } });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Something went wrong (' + r.status + ')');
  return data;
}
const say = (text) => { $('msg').textContent = text; };
const el = (tag, props = {}) => Object.assign(document.createElement(tag), props);

// Shrinks photos before upload
async function shrink(file, max = 1200) {
  const img = await createImageBitmap(file);
  const scale = Math.min(1, max / img.width);
  const c = el('canvas', { width: Math.round(img.width * scale), height: Math.round(img.height * scale) });
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const webp = c.toDataURL('image/webp', 0.75);
  return webp.startsWith('data:image/webp') ? webp : c.toDataURL('image/jpeg', 0.8);
}

function addFaq(f = { q: '', a: '' }) {
  const box = el('div'); box.className = 'faq'; box.style.cssText = 'display:grid;gap:6px';
  const q = el('input', { placeholder: 'Question', value: f.q });
  const a = el('textarea', { placeholder: 'Answer', rows: 3, value: f.a });
  const x = el('button', { type: 'button', textContent: 'Remove', onclick: () => { box.remove(); dirty = true; } });
  x.className = 'small'; box.append(q, a, x); $('faqs').append(box);
}

function insert(text) {
  const b = $('body');
  b.setRangeText(text, b.selectionStart, b.selectionEnd, 'end');
  b.focus(); dirty = true; update();
}
$('tools').onclick = (e) => {
  const button = e.target.closest('button'); if (!button) return;
  const b = $('body'), chosen = b.value.slice(b.selectionStart, b.selectionEnd);
  if (button.dataset.line) {
    const start = b.value.lastIndexOf('\n', b.selectionStart - 1) + 1;
    b.setRangeText(button.dataset.line, start, start, 'end'); b.focus(); dirty = true; update();
  } else if (button.dataset.wrap === 'bold') insert('**' + (chosen || 'bold text') + '**');
  else if (button.dataset.wrap === 'link') {
    const url = prompt('Link address (https://... or /tax)');
    if (url) insert('[' + (chosen || 'link text') + '](' + url.trim() + ')');
  } else if (button.dataset.wrap === 'table') insert('\n\n| Item | Detail |\n|---|---|\n| Example | Example |\n\n');
  else $('inline').click();
};
$('inline').onchange = async () => {
  const file = $('inline').files[0]; if (!file) return;
  const alt = prompt('Alt text: describe this photo');
  if (!alt) return say('Photo not added: alt text is required.');
  say('Uploading photo...');
  try {
    const { url } = await api('/api/posts', { method: 'POST', body: JSON.stringify({ upload: await shrink(file) }) });
    insert('\n\n![' + alt.replace(/[\[\]]/g, '') + '](' + url + ')\n\n'); say('Photo added.');
  } catch (e) { say(e.message); }
  $('inline').value = '';
};

function update() {
  const title = $('title').value.trim(), body = $('body').value, keyword = $('keyword').value.trim().toLowerCase();
  const slug = slugify($('slug').value || title);
  const seo = $('seoTitle').value.trim() || (title ? title + ' | Acctentity Consultancy' : '');
  const meta = $('metaDescription').value.trim() || $('summary').value.trim();
  $('url').textContent = '/blog/' + slug;
  $('seoCount').textContent = seo.length + ' characters (aim for about 50-60)';
  $('metaCount').textContent = meta.length + ' characters (aim for about 150-160)';
  $('gUrl').textContent = 'www.acctentity.co.ke › blog › ' + slug;
  $('gTitle').textContent = seo.length > 60 ? seo.slice(0, 57) + '...' : seo;
  $('gDesc').textContent = meta.length > 160 ? meta.slice(0, 157) + '...' : meta;

  const { html, toc } = render(body);
  $('preview').innerHTML = html; // render() escapes all typed text

  const plain = el('div', { innerHTML: html.replace(/<\/(p|li|h2|h3|tr)>/g, '. </$1>') }).textContent;
  const sentences = plain.split(/[.!?]+(\s|$)/).filter((s) => s && s.trim().split(/\s+/).length > 2);
  const long = sentences.filter((s) => s.trim().split(/\s+/).length > 20).length;
  const passive = sentences.filter((s) => /\b(is|are|was|were|be|been|being)\s+\w+(ed|en)\b/i.test(s)).length;
  const pct = (n) => sentences.length ? Math.round(n / sentences.length * 100) : 0;
  // A keyword "matches" when all of its words appear, in any order
  const has = (text) => keyword.split(/\s+/).every((w) => text.toLowerCase().includes(w));
  const first = body.split(/\n\s*\n/).find((t) => t.trim() && !t.startsWith('#')) || '';
  const checks = [
    [seo.length >= 30 && seo.length <= 60, 'SEO title length'],
    [meta.length >= 120 && meta.length <= 160, 'Meta description length'],
    [toc.length >= 2, 'At least two H2 headings'],
    [/\]\(\/(?!api)/.test(body), 'Links to another page on your site'],
    [pct(long) <= 25, 'Long sentences: ' + pct(long) + '% (aim for 25% or less)'],
    [pct(passive) <= 10, 'Possible passive voice: ' + pct(passive) + '% (rough estimate)']
  ];
  if (!keyword) checks.unshift([false, 'Add a focus keyword']);
  else checks.unshift(
    [has(title), 'Keyword in title'], [has(first), 'Keyword in first paragraph'],
    [toc.some((h) => has(h.text)), 'Keyword in an H2 heading'], [has(meta), 'Keyword in meta description'],
    [has(slug.replace(/-/g, ' ')), 'Keyword in URL']);
  $('checks').replaceChildren(...checks.map(([ok, text]) => el('li', { className: ok ? 'ok' : 'warn', textContent: (ok ? '✓ ' : '✗ ') + text })));

  const words = (title + ' ' + body + ' ' + $('tags').value).toLowerCase();
  const live = posts.filter((p) => p.slug !== editing && (p.status || 'published') === 'published' && new Date(p.publishAt || p.date) <= new Date());
  const suggestions = [
    ...pages.filter(([, , keys]) => keys.split(' ').some((k) => new RegExp('\\b' + k + '\\b').test(words))),
    ...live.filter((p) => [...(p.tags || []), p.category].filter(Boolean).some((t) => words.includes(t.toLowerCase()))).map((p) => [p.title, '/blog/' + p.slug])
  ].filter(([, url]) => !body.includes('](' + url + ')')).slice(0, 6);
  $('links').replaceChildren(...suggestions.map(([name, url]) => {
    const x = el('button', { type: 'button', textContent: name, onclick: () => insert('[' + name + '](' + url + ')') });
    x.className = 'small'; return x;
  }));
}

function reset() {
  editing = ''; slugTouched = false; dirty = false;
  $('editor').reset(); $('faqs').replaceChildren(); $('hasImage').textContent = '';
  $('mode').textContent = 'New article'; update();
}
const toLocal = (iso) => { const d = new Date(iso); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };

function edit(p) {
  if (dirty && !confirm('Discard unsaved changes?')) return;
  reset(); editing = p.slug; slugTouched = true;
  for (const f of fields) $(f).value = f === 'tags' ? (p.tags || []).join(', ') : p[f] || '';
  $('status').value = p.status || 'published';
  if (p.publishAt || p.date) $('publishAt').value = toLocal(p.publishAt || p.date);
  (p.faqs || []).forEach(addFaq);
  $('hasImage').textContent = p.image ? '(has a photo; choose a file only to replace it)' : '';
  $('mode').textContent = 'Edit article'; update(); $('editor').scrollIntoView();
}

function list() {
  $('list').replaceChildren(...posts.map((p) => {
    const row = el('div', { className: 'item' });
    const when = new Date(p.publishAt || p.date);
    let state = p.status || 'published';
    if (state === 'scheduled' && when <= new Date()) state = 'published';
    if (state === 'scheduled') state += ' for ' + when.toLocaleString('en-GB');
    const name = el('b'); name.innerHTML = esc(p.title) + '<br><small>' + esc(state) + '</small>';
    // A scheduled post whose time has passed is already live
    const open = { ...p, status: p.status === 'scheduled' && when <= new Date() ? 'published' : p.status };
    const edit_ = el('button', { type: 'button', textContent: 'Edit', onclick: () => edit(open) });
    const remove = el('button', { type: 'button', textContent: 'Delete', onclick: async () => {
      if (!confirm('Delete "' + p.title + '"?')) return;
      try {
        await api('/api/posts?slug=' + encodeURIComponent(p.slug), { method: 'DELETE' });
        if (editing === p.slug) reset();
        say('Deleted.'); await load();
      } catch (e) { say(e.message); }
    } });
    edit_.className = remove.className = 'small';
    row.append(name, edit_, remove);
    return row;
  }));
}
async function load() { posts = await api('/api/posts?admin=1'); list(); update(); }

$('login').onsubmit = async (e) => {
  e.preventDefault();
  password = $('pw').value; say('Checking...');
  try { await load(); $('login').hidden = true; $('panel').hidden = false; say(''); }
  catch (err) { say(err.message); }
};
$('editor').oninput = (e) => {
  dirty = true;
  if (e.target.id === 'slug') slugTouched = true;
  if (e.target.id === 'title' && !slugTouched) $('slug').value = slugify($('title').value);
  update();
};
$('addFaq').onclick = () => addFaq();
$('phone').onclick = () => $('preview').classList.toggle('phone');
$('cancel').onclick = () => { if (!dirty || confirm('Discard unsaved changes?')) reset(); };
$('editor').onsubmit = async (e) => {
  e.preventDefault();
  $('save').disabled = true; say('Saving...');
  try {
    const data = Object.fromEntries(fields.map((f) => [f, $(f).value]));
    data.id = editing;
    data.publishAt = $('publishAt').value ? new Date($('publishAt').value).toISOString() : '';
    data.faqs = [...document.querySelectorAll('.faq')].map((x) => ({ q: x.querySelector('input').value, a: x.querySelector('textarea').value }));
    if ($('photo').files[0]) data.image = await shrink($('photo').files[0]);
    if ($('authorPhoto').files[0]) data.authorImage = await shrink($('authorPhoto').files[0], 200);
    const saved = await api('/api/posts', { method: 'POST', body: JSON.stringify(data) });
    reset(); await load();
    say(saved.status === 'draft' ? 'Draft saved. Visitors cannot see it.' : saved.status === 'scheduled' ? 'Scheduled.' : 'Published at /blog/' + saved.slug);
  } catch (err) { say(err.message); }
  $('save').disabled = false;
};
addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });
update();
</script>
</body>
</html>
