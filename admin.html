<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Blog Admin | Acctentity Consultancy</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>[hidden]{display:none!important}main{max-width:620px;margin:0 auto;padding:40px 20px}textarea{min-height:260px}.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}.item b{flex:1}button.small{font:inherit;cursor:pointer;padding:6px 12px}#msg{font-weight:700;min-height:1.6em}</style>
</head>
<body>
<main>
<h2>Blog admin</h2>
<p id="msg" role="status"></p>
<form id="login">
  <label>Admin password<input type="password" id="pw" required autocomplete="current-password"></label>
  <button class="btn">Log in</button>
</form>
<div id="panel" hidden>
  <form id="editor">
    <h3 id="mode">New article</h3>
    <label>Title<input id="title" required maxlength="150"></label>
    <label>Short summary<input id="summary" maxlength="250"></label>
    <label>Article (leave a blank line between paragraphs; start a heading with ## )<textarea id="body" required></textarea></label>
    <label>Photo (optional, compressed automatically)<input type="file" id="photo" accept="image/*"></label>
    <button class="btn" id="save">Publish</button>
    <button type="button" class="small" id="cancel">Clear form</button>
  </form>
  <h3 style="margin-top:40px">Published articles</h3>
  <div id="list"></div>
</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let password = '', editing = '';

async function api(url, options = {}) {
  const r = await fetch(url, { ...options, headers: { 'x-admin-password': encodeURIComponent(password), 'Content-Type': 'application/json' } });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Something went wrong (' + r.status + ')');
  return data;
}
const say = (text) => { $('msg').textContent = text; };
function reset() { editing = ''; $('editor').reset(); $('mode').textContent = 'New article'; $('save').textContent = 'Publish'; }

function show(posts) {
  $('list').replaceChildren(...posts.map((p) => {
    const row = document.createElement('div');
    row.className = 'item';
    const name = document.createElement('b');
    name.textContent = p.title;
    const button = (label, fn) => {
      const x = document.createElement('button');
      x.type = 'button'; x.className = 'small'; x.textContent = label; x.onclick = fn;
      return x;
    };
    row.append(name,
      button('Edit', () => {
        reset(); editing = p.slug;
        $('title').value = p.title; $('summary').value = p.summary; $('body').value = p.body;
        $('mode').textContent = 'Edit article'; $('save').textContent = 'Save changes';
        scrollTo(0, 0);
      }),
      button('Delete', async () => {
        if (!confirm('Delete "' + p.title + '"?')) return;
        try {
          await api('/api/posts?slug=' + encodeURIComponent(p.slug), { method: 'DELETE' });
          if (editing === p.slug) reset();
          say('Deleted.'); show(await api('/api/posts'));
        } catch (e) { say(e.message); }
      }));
    return row;
  }));
}

// Shrinks the photo to at most 1200px wide before upload
async function shrink(file) {
  const img = await createImageBitmap(file);
  const scale = Math.min(1, 1200 / img.width);
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const webp = c.toDataURL('image/webp', 0.75);
  return webp.startsWith('data:image/webp') ? webp : c.toDataURL('image/jpeg', 0.8);
}

$('login').onsubmit = async (e) => {
  e.preventDefault();
  password = $('pw').value;
  say('Checking...');
  try { show(await api('/api/posts?check=1')); $('login').hidden = true; $('panel').hidden = false; say(''); }
  catch (err) { say(err.message); }
};
$('cancel').onclick = reset;
$('editor').onsubmit = async (e) => {
  e.preventDefault();
  $('save').disabled = true;
  say('Saving...');
  try {
    const file = $('photo').files[0];
    await api('/api/posts', { method: 'POST', body: JSON.stringify({
      slug: editing, title: $('title').value, summary: $('summary').value, body: $('body').value,
      image: file ? await shrink(file) : ''
    }) });
    reset(); say('Saved. It is now on your Insights page.');
    show(await api('/api/posts'));
  } catch (err) { say(err.message); }
  $('save').disabled = false;
};
</script>
</body>
</html>
